<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Calendar For Life</title>

  <defs>
    <!-- dark parchment / leather background -->
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%"  stop-color="#241608"/>
      <stop offset="55%" stop-color="#160c04"/>
      <stop offset="100%" stop-color="#08040a"/>
    </radialGradient>

    <!-- brass ring with gilt highlight -->
    <radialGradient id="brass" cx="50%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#e6c98a"/>
      <stop offset="35%" stop-color="#b8893a"/>
      <stop offset="75%" stop-color="#7a5826"/>
      <stop offset="100%" stop-color="#2c1f0a"/>
    </radialGradient>
    <linearGradient id="brassRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#d4b366"/>
      <stop offset="50%" stop-color="#8a6628"/>
      <stop offset="100%" stop-color="#2c1f0a"/>
    </linearGradient>

    <!-- gold-leaf for the star points -->
    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f4dc9c"/>
      <stop offset="55%"  stop-color="#b8893a"/>
      <stop offset="100%" stop-color="#6b4d18"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9c7430"/>
      <stop offset="50%"  stop-color="#6b4d18"/>
      <stop offset="100%" stop-color="#2c1f0a"/>
    </linearGradient>

    <radialGradient id="rivet" cx="50%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="#fff2c8"/>
      <stop offset="55%" stop-color="#b8893a"/>
      <stop offset="100%" stop-color="#4b330e"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="60%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background — safe for maskable variants -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- compass occupies the central ~80% (safe-zone for maskable icons) -->
  <g transform="translate(512 512)">

    <!-- outer brass ring -->
    <circle r="408" fill="none" stroke="#0a0502" stroke-width="36"/>
    <circle r="408" fill="none" stroke="url(#brassRim)" stroke-width="30"/>
    <circle r="392" fill="none" stroke="#3a2a10" stroke-width="2" opacity="0.6"/>
    <circle r="424" fill="none" stroke="#3a2a10" stroke-width="2" opacity="0.6"/>

    <!-- inner dial face (dark) -->
    <circle r="378" fill="#1a1006"/>
    <circle r="378" fill="url(#vignette)"/>

    <!-- cardinal ticks (long) -->
    <g stroke="#b8893a" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-372" x2="0" y2="-330"/>
      <line x1="0" y1=" 372" x2="0" y2=" 330"/>
      <line x1="-372" y1="0" x2="-330" y2="0"/>
      <line x1=" 372" y1="0" x2=" 330" y2="0"/>
    </g>

    <!-- intercardinal ticks (medium) -->
    <g stroke="#8a6628" stroke-width="4" stroke-linecap="round">
      <g transform="rotate(45)"><line x1="0" y1="-372" x2="0" y2="-338"/></g>
      <g transform="rotate(135)"><line x1="0" y1="-372" x2="0" y2="-338"/></g>
      <g transform="rotate(225)"><line x1="0" y1="-372" x2="0" y2="-338"/></g>
      <g transform="rotate(315)"><line x1="0" y1="-372" x2="0" y2="-338"/></g>
    </g>

    <!-- minor ticks every 15° -->
    <g stroke="#6b4d18" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <g transform="rotate(15)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(30)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(60)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(75)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(105)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(120)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(150)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(165)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(195)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(210)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(240)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(255)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(285)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(330)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
      <g transform="rotate(345)"><line x1="0" y1="-372" x2="0" y2="-352"/></g>
    </g>

    <!-- N E S W glyphs -->
    <g font-family="'Cinzel', Georgia, serif" font-weight="700" fill="#d4b366" text-anchor="middle">
      <text y="-282" font-size="48" letter-spacing="2">N</text>
      <text x="282" y="16" font-size="44" letter-spacing="2">E</text>
      <text y="302" font-size="44" letter-spacing="2">S</text>
      <text x="-282" y="16" font-size="44" letter-spacing="2">W</text>
    </g>

    <!-- 8-point compass star -->
    <!-- long points (N, E, S, W) — light/dark halves -->
    <g>
      <!-- N -->
      <polygon points="0,-300 -38,0 0,0" fill="url(#goldDark)"/>
      <polygon points="0,-300  38,0 0,0" fill="url(#goldLight)"/>
      <!-- S -->
      <polygon points="0, 300 -38,0 0,0" fill="url(#goldLight)"/>
      <polygon points="0, 300  38,0 0,0" fill="url(#goldDark)"/>
      <!-- E -->
      <polygon points="300, 0  0,-38 0,0" fill="url(#goldDark)"/>
      <polygon points="300, 0  0, 38 0,0" fill="url(#goldLight)"/>
      <!-- W -->
      <polygon points="-300,0  0,-38 0,0" fill="url(#goldLight)"/>
      <polygon points="-300,0  0, 38 0,0" fill="url(#goldDark)"/>
    </g>

    <!-- short points (NE, SE, SW, NW) — smaller, beneath -->
    <g opacity="0.92">
      <g transform="rotate(45)">
        <polygon points="0,-180 -22,0 0,0" fill="url(#goldDark)"/>
        <polygon points="0,-180  22,0 0,0" fill="url(#goldLight)"/>
      </g>
      <g transform="rotate(135)">
        <polygon points="0,-180 -22,0 0,0" fill="url(#goldDark)"/>
        <polygon points="0,-180  22,0 0,0" fill="url(#goldLight)"/>
      </g>
      <g transform="rotate(225)">
        <polygon points="0,-180 -22,0 0,0" fill="url(#goldDark)"/>
        <polygon points="0,-180  22,0 0,0" fill="url(#goldLight)"/>
      </g>
      <g transform="rotate(315)">
        <polygon points="0,-180 -22,0 0,0" fill="url(#goldDark)"/>
        <polygon points="0,-180  22,0 0,0" fill="url(#goldLight)"/>
      </g>
    </g>

    <!-- centre rivet -->
    <circle r="42" fill="#1a1006"/>
    <circle r="36" fill="url(#brass)"/>
    <circle r="20" fill="url(#rivet)"/>
    <circle r="8"  fill="#fff3cf" opacity="0.85"/>

    <!-- subtle inner shadow at edge -->
    <circle r="378" fill="none" stroke="#000" stroke-width="3" opacity="0.55"/>
  </g>
</svg>
